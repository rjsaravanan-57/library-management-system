<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Edit Book - Library Management System</title>

    <link rel="stylesheet" th:href="@{/style.css}">

</head>

<body>

<div class="container">

    <h1>Edit Book</h1>

    <form
        th:action="@{/books/update/{id}(id=${book.id})}"
        th:object="${book}"
        method="post">


        <!-- BOOK TITLE -->

        <div class="form-group">

            <label>Book Title</label>

            <input
                type="text"
                th:field="*{title}"
                placeholder="Enter book title"
                required>

            <p
                class="error"
                th:if="${#fields.hasErrors('title')}"
                th:errors="*{title}">
            </p>

        </div>


        <!-- PRICE -->

        <div class="form-group">

            <label>Price</label>

            <input
                type="number"
                step="0.01"
                th:field="*{price}"
                placeholder="Enter book price"
                required>

            <p
                class="error"
                th:if="${#fields.hasErrors('price')}"
                th:errors="*{price}">
            </p>

        </div>


        <!-- AUTHOR -->

        <div class="form-group">

            <label>Author</label>

            <select name="authorId" required>

                <option
                    th:each="author : ${authors}"
                    th:value="${author.id}"
                    th:text="${author.name}"
                    th:selected="${book.author != null && book.author.id == author.id}">
                </option>

            </select>

        </div>



        <!-- BUTTON -->

        <button
            type="submit"
            class="btn">

            Update Book

        </button>


        <a
            href="/books"
            class="cancel">

            Cancel

        </a>

    </form>

</div>

</body>

</html>
