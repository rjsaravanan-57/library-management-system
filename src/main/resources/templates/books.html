<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Library Management System</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<div class="container">

    <h1>Library Management System</h1>

    <a href="/books/new" class="btn">
        + Add New Book
    </a>

    <table>

        <thead>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Author</th>
            <th>Price</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="book : ${books}">

            <!-- Book ID -->
            <td th:text="${book.id}">
                1
            </td>

            <!-- Book Title -->
            <td th:text="${book.title}">
                Game of Thrones
            </td>

            <!-- Author -->
            <td>
                <span th:if="${book.author != null}"
                      th:text="${book.author.name}">
                    James Gosling
                </span>

                <span th:unless="${book.author != null}">
                    No Author
                </span>
            </td>

            <!-- Price -->
            <td th:text="${book.price}">
                985.5
            </td>

            <!-- Actions -->
            <td>

                <a class="edit"
                   th:href="@{/books/edit/{id}(id=${book.id})}">
                    Edit
                </a>

                <a class="delete"
                   th:href="@{/books/delete/{id}(id=${book.id})}"
                   onclick="return confirm('Are you sure you want to delete this book?')">
                    Delete
                </a>

            </td>

        </tr>

        </tbody>

    </table>

    <p th:if="${#lists.isEmpty(books)}">
        No books available.
    </p>

</div>

</body>
</html>
